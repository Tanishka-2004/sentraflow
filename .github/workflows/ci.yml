name: SentraFlow Lakehouse CI/CD Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-coverage:
    name: Unit & Integration Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Pytest Suite (All 60 tests)
        run: |
          PYTHONPATH=. pytest tests/ -v

  governance-gate-bypass-security-check:
    name: Deliberate PII Gate Bypass Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify Gate Halts Pipeline On Injected PII
        run: |
          PYTHONPATH=. python -m pytest tests/test_governance_gate.py -v
          PYTHONPATH=. python -m pytest tests/test_lineage.py -v

  dbt-compile-and-validate:
    name: dbt Star Schema Compilation & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run dbt Staging, Marts & Singular Tests
        run: |
          PYTHONPATH=. python -m pytest tests/test_gold_dbt.py -v

  nextjs-console-build:
    name: Next.js 14 Console Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build Next.js App
        run: |
          cd dashboard
          npm install
          npx tsc --noEmit
          npm run build

  terraform-validate:
    name: Terraform Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init & Validate
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
