services:
  # 1. MinIO (S3 Local Replacement)
  minio:
    image: minio/minio:latest
    container_name: sentraflow-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # 2. PostgreSQL (Airflow Metadata, Audit Logs, Users)
  postgres:
    image: postgres:15-alpine
    container_name: sentraflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sentraflow_user
      POSTGRES_PASSWORD: sentraflow_password
      POSTGRES_DB: sentraflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. Apache Kafka (Streaming Ingestion)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sentraflow-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sentraflow-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 4. Redis (Feature Store Cache)
  redis:
    image: redis:7-alpine
    container_name: sentraflow-redis
    ports:
      - "6379:6379"

  # 5. FastAPI Backend
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: sentraflow-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sentraflow_user:sentraflow_password@postgres:5432/sentraflow
      JWT_SECRET_KEY: sentraflow-super-secret-jwt-key-32-chars-long!
      ENVIRONMENT: production
    depends_on:
      - postgres
      - minio

  # 6. Next.js Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: sentraflow-dashboard
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  minio_data:
  postgres_data:

