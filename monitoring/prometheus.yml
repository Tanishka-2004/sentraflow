global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "sentraflow-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"

  - job_name: "sentraflow-fraud-engine"
    static_configs:
      - targets: ["fraud-engine:8001"]
    metrics_path: "/metrics"

  - job_name: "airflow"
    static_configs:
      - targets: ["airflow-webserver:8088"]
    metrics_path: "/metrics"

  - job_name: "minio"
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: "/minio/v2/metrics/cluster"

